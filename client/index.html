<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Космічна гра</title>
    <style>
      :root {
        color: #eee;
        background: #111318;
        font-family: system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #111318;
      }
      .screen {
        width: min(1000px, 100%);
        margin: auto;
        padding: 24px 12px;
      }
      .center {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .panel {
        width: min(520px, 100%);
        padding: 24px;
        border: 1px solid #3a3f49;
        border-radius: 8px;
        background: #191c22;
      }
      h1 {
        margin-top: 0;
      }
      p {
        color: #bfc4cc;
        line-height: 1.5;
      }
      label {
        display: block;
        margin: 16px 0 7px;
        color: #cbd0d8;
      }
      input,
      button {
        font: inherit;
      }
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #4b5260;
        border-radius: 5px;
        color: #fff;
        background: #101217;
      }
      button {
        cursor: pointer;
        padding: 10px 14px;
        border: 1px solid #596275;
        border-radius: 5px;
        color: #fff;
        background: #252a32;
      }
      button:hover,
      .room.selected {
        border-color: #70e4d4;
      }
      .primary {
        width: 100%;
        margin-top: 18px;
        color: #071516;
        background: #70e4d4;
      }
      .rooms {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }
      .room {
        display: flex;
        justify-content: space-between;
        width: 100%;
        text-align: left;
      }
      .room span {
        color: #aeb5c1;
      }
      .message {
        min-height: 1.5em;
        color: #ffbd69;
      }
      .loading-canvas {
        display: block;
        width: 100%;
        height: 100px;
        margin: 12px 0;
        background: #080a0d;
      }
      [hidden] {
        display: none !important;
      }
      .game {
        width: min(1000px, 100%);
        margin: auto;
        padding: 18px 12px;
      }
      .hud {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      .hud div {
        min-width: 88px;
        padding: 8px 10px;
        border: 1px solid #3a3f49;
        border-radius: 4px;
        background: #191c22;
        font-size: 11px;
        font-weight: 600;
        text-align: center;
      }
      .hud span {
        display: block;
        margin-top: 5px;
        color: #f0c674;
        font-size: 18px;
      }
      .arena-shell {
        padding: 4px;
        border: 1px solid #3a3f49;
        border-radius: 5px;
        background: #191c22;
      }
      canvas#game-canvas {
        display: block;
        width: 100%;
        height: min(78vh, 700px);
        min-height: 420px;
        border: 1px solid #4b5260;
        background: #080a0d;
      }
      .help {
        color: #c3c6cc;
        font-size: 14px;
        line-height: 1.5;
      }
      .chat {
        margin-top: 14px;
        padding: 12px;
        border: 1px solid #3a3f49;
        border-radius: 5px;
        background: #191c22;
      }
      .chat-log {
        min-height: 42px;
        max-height: 120px;
        overflow: auto;
        color: #cbd0d8;
        font-size: 14px;
      }
      .chat-form {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .chat-form input {
        flex: 1;
      }
      kbd {
        padding: 2px 5px;
        border: 1px solid #5a6372;
        border-radius: 3px;
        background: #252a32;
      }
    </style>
  </head>
  <body>
    <section class="screen center" data-screen="loading">
      <div class="panel">
        <h1>Завантаження</h1>
        <p id="loading-text">Готую гру та перевіряю файли...</p>
        <canvas
          class="loading-canvas"
          id="loading-canvas"
          width="480"
          height="100"
        ></canvas
        ><button class="primary" id="retry" hidden>Спробувати ще раз</button>
      </div>
    </section>
    <section class="screen center" data-screen="lobby" hidden>
      <div class="panel">
        <h1>Вибір кімнати</h1>
        <p>Введи ім'я, вибери кімнату і натисни «Увійти».</p>
        <label for="player-name">Ім'я</label
        ><input id="player-name" value="Гравець" maxlength="24" />
        <div class="rooms" id="rooms"></div>
        <p class="message" id="lobby-message"></p>
        <button class="primary" id="join" disabled>Увійти в кімнату</button>
      </div>
    </section>
    <main class="game" data-screen="game" hidden>
      <section class="hud" aria-label="Показники гри">
        <div>КАДРІВ/С <span id="fps">0</span></div>
        <div>КРОКІВ/С <span id="steps">0</span></div>
        <div>ЧАС КАДРУ <span id="frame-time">0 мс</span></div>
        <div>ОЧКИ <span id="score">0</span></div>
        <div>HP <span id="hp">3</span></div>
        <div>ОБ'ЄКТИ <span id="entities">0</span></div>
      </section>
      <div class="arena-shell">
        <canvas id="game-canvas" aria-label="Ігрова арена"></canvas>
      </div>
      <p class="help">
        Керування: <kbd>W</kbd>/<kbd>↑</kbd> вперед, <kbd>S</kbd>/<kbd>↓</kbd> назад,
        <kbd>A</kbd>/<kbd>←</kbd> ліворуч, <kbd>D</kbd>/<kbd>→</kbd> праворуч,
        <kbd>Space</kbd> стріляти.
      </p>
      <section class="chat">
        <div class="chat-log" id="chat-log">Підключення до кімнати...</div>
        <form class="chat-form" id="chat-form">
          <input id="chat-input" maxlength="500" placeholder="Повідомлення" /><button>
            Надіслати
          </button>
        </form>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
